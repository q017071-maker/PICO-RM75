name: Python offline regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deployment/requirements.txt
      - name: Pure math, fake robot and loopback regression
        env:
          RM75_REQUIRE_UDP: '1'
        run: python -E -s -m pytest -q project/tests deployment/test_pc.py
      - run: python -E -s project/scripts/rm75_continuous_offline.py > /tmp/continuous.jsonl
